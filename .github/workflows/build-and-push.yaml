name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-version build counter (e.g. :opencode-1.18.29-1, then -2 when a later build keeps the same opencode version).
      - name: Resolve image tags
        id: tags
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OC_VERSION=$(sed -nE 's#^FROM ghcr\.io/anomalyco/opencode:([^ ]+).*#\1#p' Dockerfile | head -n1)
          BUILD=0
          if [ -n "${OC_VERSION}" ]; then
            TOKEN=$(curl -fsSL -u "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" \
              "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])') || true
            if [ -n "${TOKEN}" ]; then
              BUILD=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
                "https://ghcr.io/v2/${GITHUB_REPOSITORY}/tags/list" \
                | OC_VERSION="${OC_VERSION}" python3 -c '
            import json, os, re, sys
            try:
                tags = json.load(sys.stdin).get("tags", [])
            except Exception:
                tags = []
            prefix = "opencode-" + os.environ["OC_VERSION"] + "-"
            nums = []
            for t in tags:
                m = re.fullmatch(re.escape(prefix) + r"(\d+)", t)
                if m:
                    nums.append(int(m.group(1)))
            print(max(nums) + 1 if nums else 1)
            ') || true
            fi
          fi
          {
            echo "tags<<__TAGS__"
            echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            if [ -n "${OC_VERSION}" ] && [ "${BUILD:-0}" -ge 1 ] 2>/dev/null; then
              echo "ghcr.io/${GITHUB_REPOSITORY}:opencode-${OC_VERSION}-${BUILD}"
            fi
            echo "__TAGS__"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
