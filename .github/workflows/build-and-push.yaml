name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tag from the pinned opencode base version (e.g. :opencode-1.18.29) for rollback-safe consumer pinning.
      - name: Resolve image tags
        id: tags
        run: |
          OC_VERSION=$(sed -nE 's#^FROM ghcr\.io/anomalyco/opencode:([^ ]+).*#\1#p' Dockerfile | head -n1)
          TAGS="ghcr.io/${GITHUB_REPOSITORY}:latest"
          if [ -n "${OC_VERSION}" ]; then
            TAGS="${TAGS}\nghcr.io/${GITHUB_REPOSITORY}:opencode-${OC_VERSION}"
          fi
          printf 'tags=%b\n' "${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
